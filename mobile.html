<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d12">
  <meta name="robots" content="noindex, nofollow">
  <title>Silvade / Mobile Preview</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- 预览壳自己也要用站点自带字体，否则这行小字在 Windows / macOS 上不是一个样子 -->
  <link rel="preload" href="assets/fonts/silvade-inter.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/silvade-inter.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #080d12;
    }

    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #dfeaf0;
      background:
        radial-gradient(circle at 50% 0%, rgba(112, 215, 239, .14), transparent 32rem),
        #080d12;
    }
    .preview-shell {
      /*
       * 预览壳 = 一块 iPhone 16 Pro 的屏幕：402 × 874（逻辑像素）。
       * iframe 永远按 402 × 874 布局，这样里面的响应式断点、字号、折行
       * 跟真机一模一样；窗口放不下时只用 transform 整体等比缩小。
       * 不能改 iframe 的布局尺寸 —— 压窄会变成"更小号的手机"，
       * 压低会让 100svh 变小、一屏看到的内容比真机少一截。
       * --k 由页面末尾的脚本按可用空间算，1 = 原始大小。
       */
      --k: 1;
      width: min(100%, calc(402px * var(--k)));
    }
    .preview-label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      /* 预览框现在按真机比例走，可能比这行字还窄：让它自己撑开、居中，别折行 */
      width: max-content;
      max-width: calc(100vw - 4rem);
      margin: 0 auto .75rem;
      white-space: nowrap;
      color: #92a6b2;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .preview-label a { color: #70d7ef; text-decoration: none; }
    .phone {
      position: relative;
      width: 100%;
      aspect-ratio: 402 / 874;
      overflow: hidden;
      border-radius: 18px;
      background: #071017;
      /* 用 box-shadow 画边框：不吃盒子的尺寸，缩放时 iframe 才能正好铺满 */
      box-shadow:
        0 0 0 1px rgba(181, 210, 225, .35),
        0 24px 80px rgba(0, 0, 0, .5);
    }
    .phone iframe {
      position: absolute;
      left: 0;
      top: 0;
      width: 402px;
      height: 874px;
      display: block;
      border: 0;
      transform-origin: 0 0;
      transform: scale(var(--k));
    }
    @media (max-width: 520px) {
      body { display: block; padding: 0; }
      .preview-label { display: none; }
      .preview-shell, .phone {
        width: 100%;
        height: 100svh;
        min-height: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .phone {
        aspect-ratio: auto;
      }
      .phone iframe {
        position: static;
        width: 100%;
        height: 100%;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <script>
    /*
     * 这个壳只给桌面浏览器预览竖屏版式用（iframe 里再嵌一层页面）。
     * 在手机上打开时直接进真正的页面：少一层 iframe 之后，
     * 点系统状态栏（时间 / 灵动岛）触发"回到顶部"才是系统原生行为，
     * 页面顶部 16px 那一条的回顶热区也才拿得到坐标。
     */
    if (window.matchMedia("(max-width: 520px)").matches) {
      location.replace("index.html");
    }
  </script>
  <main class="preview-shell">
    <div class="preview-label">
      <span>Silvade / Mobile portrait</span>
      <a href="index.html">Open full page ↗</a>
    </div>
    <div class="phone">
      <!-- 以前这里带 ?view=mobile，但 index.html 从来没读过这个参数，2026-09-15 清掉 -->
      <iframe src="index.html" title="Silvade mobile portrait preview"></iframe>
    </div>
  </main>
  <script>
    /*
     * 缩放系数：能放下就 1:1，放不下就等比缩小到刚好占满可用空间。
     * 只改显示尺寸（transform），iframe 的布局尺寸始终是 402 × 874。
     */
    (function () {
      const shell = document.querySelector(".preview-shell");
      const label = document.querySelector(".preview-label");
      const PHONE_W = 402;
      const PHONE_H = 874;
      let lastK = -1;
      function fit() {
        if (window.matchMedia("(max-width: 520px)").matches) return;
        const body = getComputedStyle(document.body);
        const labelBox = getComputedStyle(label);
        const availW = document.documentElement.clientWidth
          - parseFloat(body.paddingLeft) - parseFloat(body.paddingRight);
        const labelH = label.getBoundingClientRect().height
          + parseFloat(labelBox.marginTop) + parseFloat(labelBox.marginBottom);
        const availH = window.innerHeight
          - parseFloat(body.paddingTop) - parseFloat(body.paddingBottom) - labelH;
        const k = Math.min(1, availW / PHONE_W, availH / PHONE_H);
        if (Math.abs(k - lastK) < 0.002) return;
        lastK = k;
        shell.style.setProperty("--k", String(Math.max(k, 0.15)));
      }
      fit();
      window.addEventListener("resize", fit);
      /* 字体加载完、行高定下来之后标签高度会变，重算一次才不会顶出窗口 */
      window.addEventListener("load", fit);
      if (window.ResizeObserver) new ResizeObserver(fit).observe(label);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
      setTimeout(fit, 400);
    })();
  </script>
</body>
</html>
