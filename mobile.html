<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d12">
  <meta name="robots" content="noindex, nofollow">
  <title>Silvade / Mobile Preview</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- 预览壳自己也要用站点自带字体，否则这行小字在 Windows / macOS 上不是一个样子 -->
  <link rel="preload" href="assets/fonts/silvade-inter.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/silvade-inter.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: #080d12;
    }

    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #dfeaf0;
      background:
        radial-gradient(circle at 50% 0%, rgba(112, 215, 239, .14), transparent 32rem),
        #080d12;
    }
    .preview-shell {
      width: min(100%, 390px);
    }
    .preview-label {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 .75rem;
      color: #92a6b2;
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .preview-label a { color: #70d7ef; text-decoration: none; }
    .phone {
      width: 100%;
      height: min(844px, calc(100svh - 5rem));
      min-height: 620px;
      overflow: hidden;
      border: 1px solid rgba(181, 210, 225, .35);
      border-radius: 18px;
      background: #071017;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .5);
    }
    iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
    }
    @media (max-width: 520px) {
      body { display: block; padding: 0; }
      .preview-label { display: none; }
      .preview-shell, .phone {
        width: 100%;
        height: 100svh;
        min-height: 0;
        border: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <script>
    /*
     * 这个壳只给桌面浏览器预览竖屏版式用（iframe 里再嵌一层页面）。
     * 在手机上打开时直接进真正的页面：少一层 iframe 之后，
     * 点系统状态栏（时间 / 灵动岛）触发"回到顶部"才是系统原生行为，
     * 页面顶部 16px 那一条的回顶热区也才拿得到坐标。
     */
    if (window.matchMedia("(max-width: 520px)").matches) {
      location.replace("index.html");
    }
  </script>
  <main class="preview-shell">
    <div class="preview-label">
      <span>Silvade / Mobile portrait</span>
      <a href="index.html">Open full page ↗</a>
    </div>
    <div class="phone">
      <!-- 以前这里带 ?view=mobile，但 index.html 从来没读过这个参数，2026-09-15 清掉 -->
      <iframe src="index.html" title="Silvade mobile portrait preview"></iframe>
    </div>
  </main>
</body>
</html>
